name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main, "claude/**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (dev extras, no hardware)
        working-directory: auto-diag-suite
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: auto-diag-suite
        run: ruff check . --select E,F,W
        # Hardware packages are absent on CI — import errors for optional
        # backends are expected and excluded via noqa or try/except in code.

      - name: Run tests (sim transport)
        working-directory: auto-diag-suite
        env:
          ADS_TRANSPORT: sim
        run: python -m pytest -q

  build-check:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel
        working-directory: auto-diag-suite
        run: python -m build --wheel
