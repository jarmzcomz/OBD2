name: Android APK

# Compila el APK de debug del proyecto Android y lo publica como artifact
# descargable. Se ejecuta en push a la rama de desarrollo y manualmente.
on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "auto-diag-suite/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-diag-suite/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-diag-suite-debug-apk
          path: auto-diag-suite/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
