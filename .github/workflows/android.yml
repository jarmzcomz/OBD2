name: Android APK

# Compila el APK de debug del proyecto Android y lo publica como artifact
# descargable. Se ejecuta en push a la rama de desarrollo y manualmente.
on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "auto-diag-suite/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Permite que el job cree/actualice un Release con el APK adjunto.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-diag-suite/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

      # Crea UNA SOLA VEZ un keystore de firma estable y lo guarda en el repo.
      # Sin esto, cada build del CI firma el APK con un debug.keystore distinto y
      # Android obliga a DESINSTALAR para actualizar. Usa las credenciales públicas
      # de debug ("android"): no es un secreto, solo garantiza firma consistente.
      # El commit lleva [skip ci] para no disparar otro build en bucle.
      - name: Ensure stable signing keystore
        run: |
          KS=app/autodiag.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" \
              -storepass android -keypass android \
              -alias autodiag -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AutoDiag, OU=Dev, O=AutoDiag, L=NA, ST=NA, C=NA"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KS"
            git commit -m "ci: keystore de firma estable para actualizaciones in-place [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-diag-suite-debug-apk
          path: auto-diag-suite/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publica el APK en un Release con tag fijo "android-latest" para tener
      # un enlace de descarga directa (sin login) que siempre apunta al
      # ultimo APK compilado. Solo corre en push a la rama, no en PRs.
      - name: Publish APK to Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AutoDiag Android (ultimo build)
          body: |
            APK de debug compilado automaticamente desde la rama de desarrollo.

            Descarga directa: **app-debug.apk** (mas abajo en Assets).
            Commit: ${{ github.sha }}
          files: auto-diag-suite/android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
